<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<base href="./">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PictureView</title>
<style>
  :root, [data-theme="light"] {
    --primary: #03a9f4;
    --primary-text: #fff;
    --accent: #03a9f4;
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface2: #f0f2f5;
    --border: #e1e5eb;
    --text: #1c1c1c;
    --text-dim: #6e7681;
    --text-bright: #1c1c1c;
    --danger: #db4437;
    --success: #0f9d58;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --radius: 12px;
    --gutter: 16px;
    --header-bg: #ffffff;
    --input-bg: #f5f6fa;
    --timeline-active-bg: #e0f3fb;
    --timeline-active-border: #03a9f4;
    --timeline-active-text: #0277bd;
    --timeline-hover-bg: #f0f2f5;
    --backdrop: rgba(0,0,0,.35);
  }
  [data-theme="dark"] {
    --primary: #4fc3f7;
    --primary-text: #0a0a0a;
    --accent: #4fc3f7;
    --bg: #111318;
    --surface: #1c1f27;
    --surface2: #252830;
    --border: #333842;
    --text: #c8cdd5;
    --text-dim: #6b7280;
    --text-bright: #edf0f5;
    --danger: #f44336;
    --success: #66bb6a;
    --shadow: 0 1px 4px rgba(0,0,0,.3);
    --header-bg: #1c1f27;
    --input-bg: #111318;
    --timeline-active-bg: rgba(79,195,247,.12);
    --timeline-active-border: #4fc3f7;
    --timeline-active-text: #4fc3f7;
    --timeline-hover-bg: #252830;
    --backdrop: rgba(0,0,0,.6);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  html { font-size: 14px; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    display: flex; flex-direction: column;
    transition: background .2s, color .2s;
    overscroll-behavior: none;
  }
  @supports (height: 100dvh) { body { height: 100dvh; } }

  header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 0 var(--gutter);
    display: flex; align-items: center; gap: 12px;
    height: 56px; flex-shrink: 0;
    box-shadow: var(--shadow);
    z-index: 100;
  }
  .logo {
    font-size: 15px; font-weight: 700; color: var(--accent);
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .logo svg { width: 24px; height: 24px; fill: var(--accent); flex-shrink: 0; }
  .header-spacer { flex: 1; }
  .stats-chip {
    font-size: 12px; color: var(--text-dim);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px;
    display: flex; align-items: center; gap: 6px;
    min-width: 0;
  }
  .stats-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; }
  .stats-chip.warn { border-color: var(--danger); color: var(--danger); }
  .stats-short { display: none; }
  .theme-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
    color: var(--text); font-size: 13px; display: flex; align-items: center; gap: 6px;
    transition: background .15s; flex-shrink: 0;
  }
  .theme-btn:hover { background: var(--surface2); }

  .main-layout {
    flex: 1 1 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    min-height: 0; overflow: hidden;
  }

  /* ── Viewer Area ── */
  .viewer-area {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto auto;
    padding: var(--gutter); gap: var(--gutter);
    overflow: hidden;
    min-width: 0; min-height: 0;
  }
  .image-card {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); box-shadow: var(--shadow);
    overflow: hidden;
    min-height: 0;
  }
  .image-toolbar {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .img-info { flex: 1; min-width: 0; }
  .img-time {
    font-weight: 700; font-size: 18px; color: var(--text-bright);
    font-variant-numeric: tabular-nums; line-height: 1.2;
  }
  .img-date { font-size: 12px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .counter-badge {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--text-dim);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .image-frame {
    position: relative; background: #000;
    min-height: 0; overflow: hidden;
    width: 100%; height: 100%;
    touch-action: pan-y;
  }
  .image-frame img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    transform-origin: center center;
    transition: transform .15s;
    -webkit-user-drag: none; user-select: none;
  }

  /* ── Stretch Popover ── */
  .stretch-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 9px; cursor: pointer; color: var(--text-dim);
    display: flex; align-items: center; gap: 5px; font-size: 12px;
    transition: background .15s, color .15s;
    position: relative; min-height: 32px;
  }
  .stretch-btn:hover, .stretch-btn.active { background: var(--surface2); color: var(--text); }
  .stretch-btn svg { width: 14px; height: 14px; fill: currentColor; }
  .stretch-popover {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.15);
    padding: 16px; width: 260px; max-width: calc(100vw - 2 * var(--gutter) - 24px); z-index: 200;
  }
  .stretch-popover.open { display: block; }
  .stretch-popover h4 {
    font-size: 12px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;
  }
  .stretch-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .stretch-row label { font-size: 12px; color: var(--text); white-space: nowrap; min-width: 60px; }
  .stretch-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); cursor: pointer; }
  .stretch-row input[type=number] {
    width: 62px; padding: 4px 6px; font-size: 12px;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); text-align: center;
  }
  .stretch-reset {
    font-size: 11px; color: var(--accent); background: none; border: none;
    cursor: pointer; padding: 0; text-decoration: underline;
  }
  .no-image {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    color: var(--text-dim); padding: 40px; text-align: center;
  }
  .no-image svg { width: 64px; height: 64px; opacity: .4; fill: var(--text-dim); }
  .no-image p { font-size: 15px; }
  .no-image small { font-size: 12px; word-break: break-all; }

  /* ── Navigation ── */
  .nav-controls {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    flex-shrink: 0;
  }
  .nav-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 24px; cursor: pointer;
    color: var(--text); font-size: 14px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s, border-color .15s, color .15s;
    box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:hover:not(:disabled) {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
  .nav-btn.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .nav-btn.primary:hover:not(:disabled) {
    background: var(--primary); opacity: .9;
  }
  .nav-btn svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  .nav-btn.timeline-btn { display: none; }

  /* ── Wiedergabe ── */
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .play-controls {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    flex-shrink: 0;
  }
  .nav-btn .icon-pause { display: none; }
  .nav-btn.playing { background: var(--success); border-color: var(--success); color: #fff; }
  .nav-btn.playing:hover:not(:disabled) { background: var(--success); border-color: var(--success); opacity: .9; }
  .nav-btn.playing .icon-play { display: none; }
  .nav-btn.playing .icon-pause { display: block; }
  .speed-ctl {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 0 8px 0 10px; box-shadow: var(--shadow);
    color: var(--text-dim); font-size: 12px; white-space: nowrap;
  }
  .speed-ctl svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
  .speed-ctl select {
    background: transparent; border: none; color: var(--text);
    font-size: 14px; font-weight: 500; padding: 10px 4px; cursor: pointer;
    font-family: inherit; outline: none;
  }
  .speed-ctl select option { background: var(--surface); color: var(--text); }

  /* ── Timeline Panel ── */
  .sheet-backdrop { display: none; }
  .timeline-panel {
    background: var(--surface); border-left: 1px solid var(--border);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
    min-height: 0;
  }
  .timeline-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--text-dim);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .timeline-header svg { width: 14px; height: 14px; fill: var(--text-dim); }
  .sheet-close {
    display: none; margin-left: auto;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); width: 36px; height: 36px; cursor: pointer;
    align-items: center; justify-content: center;
  }
  .sheet-close svg { width: 18px; height: 18px; fill: currentColor; }
  .timeline-list {
    overflow-y: auto; padding: 8px;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
  }
  .timeline-list::-webkit-scrollbar { width: 4px; }
  .timeline-list::-webkit-scrollbar-track { background: transparent; }
  .timeline-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .day-group {
    margin-bottom: 4px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border);
    transition: border-color .15s;
  }
  .day-group.active {
    border-color: var(--timeline-active-border);
  }
  .day-header {
    padding: 8px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    transition: background .15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .day-header:hover { background: var(--timeline-hover-bg); }
  .day-group.active .day-header {
    background: var(--timeline-active-bg);
    color: var(--timeline-active-text);
  }
  .day-label { flex: 1; font-size: 12px; font-weight: 600; }
  .day-label .day-rel { font-weight: 700; }
  .day-count {
    font-size: 11px; background: var(--border);
    border-radius: 10px; padding: 1px 7px; color: var(--text-dim);
  }
  .day-group.active .day-count {
    background: var(--timeline-active-border); color: #fff;
  }
  .day-chevron {
    width: 14px; height: 14px; fill: var(--text-dim);
    transition: transform .2s;
  }
  .day-group.open .day-chevron { transform: rotate(90deg); }

  .day-images { display: none; padding: 4px; background: var(--bg); }
  .day-group.open .day-images { display: block; }
  .thumb-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; border-radius: 7px; cursor: pointer;
    transition: background .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .thumb-item:hover { background: var(--timeline-hover-bg); }
  .thumb-item.selected { background: var(--timeline-active-bg); }
  .thumb-item.selected .thumb-time { color: var(--timeline-active-text); font-weight: 600; }
  .thumb-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0;
  }
  .thumb-item.selected .thumb-dot { background: var(--timeline-active-border); }
  .thumb-time { font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }

  .empty-timeline {
    padding: 24px 16px; text-align: center;
    color: var(--text-dim); font-size: 12px;
  }

  /* ── Keyboard hint ── */
  .kbd-hint {
    font-size: 11px; color: var(--text-dim); text-align: center;
    padding: 4px 0;
  }
  kbd {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font-size: 10px;
    font-family: monospace;
  }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    :root, [data-theme="light"], [data-theme="dark"] { --gutter: 8px; }
    header { height: 48px; gap: 8px; }
    .logo { font-size: 14px; }
    .stats-long { display: none; }
    .stats-short { display: inline; }
    .theme-btn { padding: 6px 8px; }

    .main-layout { grid-template-columns: minmax(0, 1fr); }
    .viewer-area { grid-template-rows: minmax(0, 1fr) auto; padding: 8px; gap: 8px; }
    .image-card { border-radius: 10px; }
    .image-toolbar { padding: 8px 12px; gap: 8px; }
    .img-info { cursor: pointer; }
    .img-time { font-size: 17px; }
    .kbd-hint { display: none; }

    .nav-controls {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn { padding: 0; min-height: 50px; gap: 0; border-radius: 10px; }
    .nav-btn span { display: none; }
    .nav-btn svg { width: 26px; height: 26px; }
    .nav-btn:hover:not(:disabled) { background: var(--surface); border-color: var(--border); color: var(--text); }
    .nav-btn.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; opacity: 1; }
    .nav-btn.playing:hover:not(:disabled) { opacity: 1; }
    .nav-btn.timeline-btn { display: flex; }

    .controls { gap: 6px; }
    .play-controls {
      display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-controls { padding-bottom: 0; }
    .speed-ctl { min-height: 50px; }
    .speed-ctl select { font-size: 15px; padding: 12px 2px; }

    .sheet-backdrop {
      display: block; position: fixed; inset: 0; background: var(--backdrop);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 390;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .timeline-panel {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 72vh; max-height: 85dvh;
      border-left: none; border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,.25);
      transform: translateY(102%);
      transition: transform .25s ease;
      z-index: 400;
    }
    .timeline-panel.open { transform: translateY(0); }
    .timeline-header { padding: 10px 12px 10px 16px; font-size: 13px; }
    .sheet-close { display: flex; }
    .timeline-list { padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
    .day-header { padding: 12px 14px; }
    .day-label { font-size: 14px; }
    .thumb-item { padding: 11px 14px; }
    .thumb-time { font-size: 15px; }
  }
</style>
</head>
<body data-theme="light">

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 2.75c1.24 0 2.25 1.01 2.25 2.25S13.24 11.25 12 11.25 9.75 10.24 9.75 9s1.01-2.25 2.25-2.25zM17 17H7v-.75c0-1.67 3.33-2.5 5-2.5s5 .83 5 2.5V17z"/></svg>
    PictureView
  </div>
  <div class="header-spacer"></div>
  <div class="stats-chip" id="statsChip">
    <span class="stats-long" id="statsText">Lade...</span>
    <span class="stats-short" id="statsShort">…</span>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="Theme wechseln">
    <svg id="themeIcon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
      <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/>
    </svg>
  </button>
</header>

<div class="main-layout">
  <!-- Viewer -->
  <div class="viewer-area">
    <div class="image-card">
      <div class="image-toolbar">
        <div class="img-info" onclick="openTimeline()" title="Zeitleiste öffnen">
          <div class="img-time" id="imgTime">–</div>
          <div class="img-date" id="imgDate">Kein Bild ausgewählt</div>
        </div>
        <div class="counter-badge" id="counterBadge">0 / 0</div>
        <div style="position:relative;">
          <button class="stretch-btn" id="stretchToggle" onclick="toggleStretchPopover()" title="Bildkorrektur">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <span id="stretchLabel">1.00×</span>
          </button>
          <div class="stretch-popover" id="stretchPopover">
            <h4>Bildkorrektur</h4>
            <div class="stretch-row">
              <label>Breite ×</label>
              <input type="range" id="stretchXSlider" min="0.5" max="2.0" step="0.01" value="1.0" oninput="onStretchInput('x', this.value)">
              <input type="number" id="stretchXNum" min="0.5" max="2.0" step="0.01" value="1.00" oninput="onStretchInput('x', this.value)">
            </div>
            <div class="stretch-row">
              <label>Höhe ×</label>
              <input type="range" id="stretchYSlider" min="0.5" max="2.0" step="0.01" value="1.0" oninput="onStretchInput('y', this.value)">
              <input type="number" id="stretchYNum" min="0.5" max="2.0" step="0.01" value="1.00" oninput="onStretchInput('y', this.value)">
            </div>
            <button class="stretch-reset" onclick="resetStretch()">Zurücksetzen (1.00 / 1.00)</button>
          </div>
        </div>
      </div>
      <div class="image-frame" id="imageFrame">
        <div class="no-image" id="noImageMsg">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          <p>Keine Bilder gefunden</p>
          <small id="noImgHint">Ordner wird überprüft...</small>
        </div>
      </div>
    </div>

    <div class="controls">
    <div class="nav-controls">
      <button class="nav-btn" id="btnNewest" onclick="goNewest()" title="Neuestes Bild (Pos1)">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        <span>Neuestes</span>
      </button>
      <button class="nav-btn" id="btnNewer" onclick="goNewer()" title="Neueres Bild (←)">
        <svg viewBox="0 0 24 24"><path d="M15.41 16.59 10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
        <span>Neuer</span>
      </button>
      <button class="nav-btn primary" id="btnOlder" onclick="goOlder()" title="Älteres Bild (→)">
        <span>Älter</span>
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </button>
      <button class="nav-btn" id="btnOldest" onclick="goOldest()" title="Ältestes Bild (Ende)">
        <span>Ältestes</span>
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
      <button class="nav-btn timeline-btn" id="btnTimeline" onclick="openTimeline()" title="Zeitleiste">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
        <span>Zeitleiste</span>
      </button>
    </div>

    <div class="play-controls">
      <button class="nav-btn" id="btnPlayNewer" onclick="togglePlay(-1)" title="Automatisch Richtung Neuer abspielen">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M17 6v12L7 12z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        <span>Richtung Neuer</span>
      </button>
      <label class="speed-ctl" title="Bilder pro Sekunde">
        <svg viewBox="0 0 24 24"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z"/></svg>
        <select id="fpsSelect" onchange="setFps(this.value)">
          <option value="0.5">0,5 B/s</option>
          <option value="1">1 B/s</option>
          <option value="2">2 B/s</option>
          <option value="3">3 B/s</option>
          <option value="5">5 B/s</option>
          <option value="10">10 B/s</option>
        </select>
      </label>
      <button class="nav-btn" id="btnPlayOlder" onclick="togglePlay(1)" title="Automatisch Richtung Älter abspielen">
        <span>Richtung Älter</span>
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 6v12l10-6z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
    </div>
    </div>

    <div class="kbd-hint">
      <kbd>←</kbd> Neuer &nbsp;&nbsp; <kbd>→</kbd> Älter &nbsp;&nbsp; <kbd>Pos1</kbd> Neuestes &nbsp;&nbsp; <kbd>Ende</kbd> Ältestes &nbsp;&nbsp; <kbd>Leer</kbd> Abspielen / Pause
    </div>
  </div>

  <!-- Timeline -->
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeTimeline()"></div>
  <div class="timeline-panel" id="timelinePanel">
    <div class="timeline-header">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
      Zeitleiste
      <button class="sheet-close" onclick="closeTimeline()" title="Schließen" aria-label="Zeitleiste schließen">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="timeline-list" id="timelineList">
      <div class="empty-timeline">Lade Bilder...</div>
    </div>
  </div>
</div>

<script>
// Reihenfolge: Index 0 ist immer das neueste Bild, höhere Indizes werden älter.
let allImages = [];
let currentIndex = -1;
let stretchX = parseFloat(localStorage.getItem('pv-stretch-x') || '1.0');
let stretchY = parseFloat(localStorage.getItem('pv-stretch-y') || '1.0');
let fromDayClick = false;

// Automatische Wiedergabe: playDir +1 = Richtung älter, -1 = Richtung neuer
let playTimer = null;
let playDir = 0;
let lastPlayDir = 1;
let fps = parseFloat(localStorage.getItem('pv-fps') || '2');
let currentImgEl = null;

const imageFrame = document.getElementById('imageFrame');
const noImageMsg = document.getElementById('noImageMsg');
const imgTime = document.getElementById('imgTime');
const imgDate = document.getElementById('imgDate');
const counterBadge = document.getElementById('counterBadge');
const timelineList = document.getElementById('timelineList');
const timelinePanel = document.getElementById('timelinePanel');
const sheetBackdrop = document.getElementById('sheetBackdrop');

function sortNewestFirst(list) {
  return list.slice().sort((a, b) => b.timestamp - a.timestamp);
}

function localDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function relativeDay(dateStr) {
  const now = new Date();
  if (dateStr === localDateStr(now)) return 'Heute';
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (dateStr === localDateStr(y)) return 'Gestern';
  return '';
}

function formatDayShort(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
}

function formatDayLong(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
}

function timeOf(img) {
  return (img.datetime.split(' ')[1] || '').slice(0, 8);
}

function imgUrl(img) {
  return `./api/image/${img.name.split('/').map(encodeURIComponent).join('/')}`;
}

async function loadStats() {
  const stats = await (await fetch('./api/stats')).json();
  const deleteInfo = stats.auto_delete_enabled
    ? `⚠ Auto-Löschen aktiv: Bilder älter als ${stats.delete_after_days} Tage werden unwiderruflich gelöscht`
    : `Auto-Löschen: deaktiviert`;
  const full = `${stats.total} Bilder · ${stats.days} Tage · ${deleteInfo}`;
  document.getElementById('statsText').textContent = full;
  document.getElementById('statsShort').textContent =
    `${stats.total} Bilder` + (stats.auto_delete_enabled ? ` · ⚠ ${stats.delete_after_days} T.` : '');
  const chip = document.getElementById('statsChip');
  chip.classList.toggle('warn', !!stats.auto_delete_enabled);
  chip.title = full;
  document.getElementById('noImgHint').textContent = `Ordner: ${stats.folder}`;
}

async function loadImages() {
  try {
    const [imgResp] = await Promise.all([fetch('./api/images'), loadStats()]);
    allImages = sortNewestFirst(await imgResp.json());

    buildTimeline();
    updateNav();

    if (allImages.length > 0) {
      showImage(0);
    }
  } catch (e) {
    document.getElementById('statsText').textContent = 'Fehler beim Laden';
    document.getElementById('statsShort').textContent = 'Fehler';
    timelineList.innerHTML = '<div class="empty-timeline">Verbindungsfehler</div>';
  }
}

function buildTimeline() {
  if (allImages.length === 0) {
    timelineList.innerHTML = '<div class="empty-timeline">Keine Bilder vorhanden</div>';
    return;
  }

  // allImages ist bereits neueste zuerst sortiert, daher sind auch die Tage
  // und die Bilder innerhalb eines Tages in dieser Reihenfolge.
  const byDay = {};
  const dayOrder = [];
  allImages.forEach((img, idx) => {
    if (!byDay[img.date]) { byDay[img.date] = []; dayOrder.push(img.date); }
    byDay[img.date].push({ ...img, globalIndex: idx });
  });

  timelineList.innerHTML = dayOrder.map(day => {
    const items = byDay[day];
    const rel = relativeDay(day);
    const label = (rel ? `<span class="day-rel">${rel}</span> · ` : '') + formatDayShort(day);
    const thumbs = items.map(img => `
      <div class="thumb-item" id="thumb-${img.globalIndex}" onclick="pickImage(${img.globalIndex})">
        <span class="thumb-dot"></span>
        <span class="thumb-time">${timeOf(img)}</span>
      </div>`).join('');
    return `<div class="day-group" id="daygroup-${day}">
      <div class="day-header" onclick="toggleDay('${day}')">
        <svg class="day-chevron" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        <span class="day-label">${label}</span>
        <span class="day-count">${items.length}</span>
      </div>
      <div class="day-images">${thumbs}</div>
    </div>`;
  }).join('');
}

function toggleDay(day) {
  // Klick auf Tag-Header: zum neuesten Bild dieses Tages springen.
  // Dadurch wird genau dieser Tag geöffnet und alle anderen geschlossen.
  const firstIdx = allImages.findIndex(img => img.date === day);
  if (firstIdx >= 0) {
    fromDayClick = true;
    showImage(firstIdx);
    fromDayClick = false;
  }
}

function pickImage(index) {
  showImage(index);
  closeTimeline();
}

function showImage(index) {
  if (index < 0 || index >= allImages.length) return;
  currentIndex = index;

  const img = allImages[index];

  const oldImg = imageFrame.querySelector('img');
  if (oldImg) oldImg.remove();
  noImageMsg.style.display = 'none';

  const el = document.createElement('img');
  el.src = imgUrl(img);
  el.alt = img.datetime;
  el.draggable = false;
  el.onerror = () => {
    el.remove();
    noImageMsg.style.display = 'flex';
  };
  applyStretch(el);
  imageFrame.appendChild(el);
  currentImgEl = el;
  preloadNeighbors();

  const rel = relativeDay(img.date);
  imgTime.textContent = timeOf(img);
  imgDate.textContent = (rel ? rel + ' · ' : '') + formatDayLong(img.date);
  counterBadge.textContent = `${index + 1} / ${allImages.length}`;

  updateNav();
  highlightTimeline(index, img.date);
}

function highlightTimeline(index, date) {
  document.querySelectorAll('.thumb-item.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.day-group').forEach(el => el.classList.remove('active', 'open'));

  const dayGroup = document.getElementById(`daygroup-${date}`);
  if (dayGroup) {
    dayGroup.classList.add('active', 'open');
  }

  requestAnimationFrame(() => {
    const thumb = document.getElementById(`thumb-${index}`);
    if (!thumb) return;
    thumb.classList.add('selected');
    if (fromDayClick) return;
    scrollDayIntoView(dayGroup);
    scrollThumbIntoView(thumb);
  });
}

function scrollDayIntoView(group) {
  const list = timelineList;
  if (!list || !group) return;
  const gTop = group.offsetTop;
  const gBot = gTop + group.offsetHeight;
  const vTop = list.scrollTop;
  const vBot = vTop + list.clientHeight;
  if (gTop < vTop) list.scrollTop = gTop - 8;
  else if (gBot > vBot) list.scrollTop = gBot - list.clientHeight + 8;
}

function scrollThumbIntoView(thumb) {
  const list = timelineList;
  if (!list || !thumb) return;
  let top = 0;
  let el = thumb;
  while (el && el !== list) { top += el.offsetTop; el = el.offsetParent; }
  const bot = top + thumb.offsetHeight;
  const vTop = list.scrollTop;
  const vBot = vTop + list.clientHeight;
  if (top < vTop) list.scrollTop = top - 4;
  else if (bot > vBot) list.scrollTop = bot - list.clientHeight + 4;
}

function updateNav() {
  const atNewest = currentIndex <= 0;
  const atOldest = currentIndex < 0 || currentIndex >= allImages.length - 1;
  document.getElementById('btnNewer').disabled = atNewest;
  document.getElementById('btnNewest').disabled = atNewest;
  document.getElementById('btnOlder').disabled = atOldest;
  document.getElementById('btnOldest').disabled = atOldest;
  document.getElementById('btnPlayNewer').disabled = atNewest && playDir !== -1;
  document.getElementById('btnPlayOlder').disabled = atOldest && playDir !== 1;
}

function goOlder()  { if (currentIndex < allImages.length - 1) showImage(currentIndex + 1); }
function goNewer()  { if (currentIndex > 0) showImage(currentIndex - 1); }
function goNewest() { showImage(0); }
function goOldest() { showImage(allImages.length - 1); }

// ── Automatische Wiedergabe ──
function preloadNeighbors() {
  // Beim Abspielen nur die Richtung vorladen, sonst beide Nachbarn.
  const dirs = playDir ? [playDir] : [1, -1];
  dirs.forEach(d => {
    const n = allImages[currentIndex + d];
    if (n) { const p = new Image(); p.src = imgUrl(n); }
  });
}

function playTick() {
  // Nicht weiterschalten, solange das aktuelle Bild noch lädt.
  if (currentImgEl && currentImgEl.parentNode && !currentImgEl.complete) return;
  const next = currentIndex + playDir;
  if (next < 0 || next >= allImages.length) { stopPlay(); return; }
  showImage(next);
  // Letztes Bild in dieser Richtung erreicht: sofort anhalten.
  if (next + playDir < 0 || next + playDir >= allImages.length) stopPlay();
}

function startPlayTimer() {
  clearInterval(playTimer);
  playTimer = setInterval(playTick, Math.max(50, Math.round(1000 / fps)));
}

function togglePlay(dir) {
  if (playTimer && playDir === dir) { stopPlay(); return; }
  const next = currentIndex + dir;
  if (next < 0 || next >= allImages.length) return;
  playDir = dir;
  lastPlayDir = dir;
  startPlayTimer();
  updatePlayUI();
  preloadNeighbors();
}

function stopPlay() {
  clearInterval(playTimer);
  playTimer = null;
  playDir = 0;
  updatePlayUI();
}

function updatePlayUI() {
  document.getElementById('btnPlayNewer').classList.toggle('playing', playDir === -1);
  document.getElementById('btnPlayOlder').classList.toggle('playing', playDir === 1);
  updateNav();
}

function setFps(val) {
  fps = Math.min(30, Math.max(0.1, parseFloat(val) || 2));
  localStorage.setItem('pv-fps', String(fps));
  document.getElementById('fpsSelect').value = String(fps);
  if (playTimer) startPlayTimer();
}

(function initFps() {
  const sel = document.getElementById('fpsSelect');
  const has = Array.from(sel.options).some(o => parseFloat(o.value) === fps);
  if (!has) {
    const o = document.createElement('option');
    o.value = String(fps); o.textContent = `${String(fps).replace('.', ',')} B/s`;
    sel.appendChild(o);
  }
  sel.value = String(fps);
})();

// ── Zeitleiste als Bottom-Sheet (nur auf schmalen Bildschirmen sichtbar) ──
function openTimeline() {
  timelinePanel.classList.add('open');
  sheetBackdrop.classList.add('open');
  if (currentIndex >= 0) {
    requestAnimationFrame(() => {
      const thumb = document.getElementById(`thumb-${currentIndex}`);
      const group = document.getElementById(`daygroup-${allImages[currentIndex].date}`);
      scrollDayIntoView(group);
      scrollThumbIntoView(thumb);
    });
  }
}
function closeTimeline() {
  timelinePanel.classList.remove('open');
  sheetBackdrop.classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); goOlder(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goNewer(); }
  else if (e.key === 'Home') { e.preventDefault(); goNewest(); }
  else if (e.key === 'End') { e.preventDefault(); goOldest(); }
  else if (e.key === 'Escape') { closeTimeline(); }
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    if (playTimer) stopPlay(); else togglePlay(lastPlayDir);
  }
});

// ── Wischen auf dem Bild: nach links = älter, nach rechts = neuer ──
let touchStartX = null, touchStartY = null;
imageFrame.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { touchStartX = null; return; }
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
imageFrame.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (dx < 0) goOlder(); else goNewer();
}, { passive: true });

function applyStretch(el) {
  const target = el || imageFrame.querySelector('img');
  if (!target) return;
  const sx = stretchX !== 1.0 || stretchY !== 1.0 ? `scaleX(${stretchX}) scaleY(${stretchY})` : '';
  target.style.transform = sx;
}

function onStretchInput(axis, val) {
  const v = Math.min(2.0, Math.max(0.5, parseFloat(val) || 1.0));
  if (axis === 'x') {
    stretchX = v;
    document.getElementById('stretchXSlider').value = v;
    document.getElementById('stretchXNum').value = v.toFixed(2);
    localStorage.setItem('pv-stretch-x', v);
  } else {
    stretchY = v;
    document.getElementById('stretchYSlider').value = v;
    document.getElementById('stretchYNum').value = v.toFixed(2);
    localStorage.setItem('pv-stretch-y', v);
  }
  document.getElementById('stretchLabel').textContent =
    (stretchX === 1.0 && stretchY === 1.0) ? '1.00×' : `${stretchX.toFixed(2)}×`;
  applyStretch();
}

function resetStretch() {
  stretchX = 1.0; stretchY = 1.0;
  ['stretchXSlider','stretchXNum','stretchYSlider','stretchYNum'].forEach(id => {
    document.getElementById(id).value = '1.00';
  });
  document.getElementById('stretchLabel').textContent = '1.00×';
  localStorage.removeItem('pv-stretch-x');
  localStorage.removeItem('pv-stretch-y');
  applyStretch();
}

function toggleStretchPopover() {
  const pop = document.getElementById('stretchPopover');
  const btn = document.getElementById('stretchToggle');
  pop.classList.toggle('open');
  btn.classList.toggle('active', pop.classList.contains('open'));
}

document.addEventListener('click', e => {
  const pop = document.getElementById('stretchPopover');
  if (pop.classList.contains('open') && !e.target.closest('.stretch-btn') && !e.target.closest('.stretch-popover')) {
    pop.classList.remove('open');
    document.getElementById('stretchToggle').classList.remove('active');
  }
});

function toggleTheme() {
  const body = document.body;
  const current = body.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  body.setAttribute('data-theme', next);
  localStorage.setItem('pv-theme', next);
}

(function initTheme() {
  const saved = localStorage.getItem('pv-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.body.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
})();

(function initStretch() {
  document.getElementById('stretchXSlider').value = stretchX;
  document.getElementById('stretchXNum').value = stretchX.toFixed(2);
  document.getElementById('stretchYSlider').value = stretchY;
  document.getElementById('stretchYNum').value = stretchY.toFixed(2);
  if (stretchX !== 1.0 || stretchY !== 1.0) {
    document.getElementById('stretchLabel').textContent = `${stretchX.toFixed(2)}×`;
  }
})();

loadImages();

// Alle 60 Sekunden nach neuen Bildern schauen. Das aktuell angezeigte Bild
// bleibt ausgewählt, auch wenn sich durch neue Bilder die Indizes verschieben.
setInterval(async () => {
  try {
    const resp = await fetch('./api/images');
    const fresh = sortNewestFirst(await resp.json());
    if (fresh.length === allImages.length) return;
    const currentName = currentIndex >= 0 && allImages[currentIndex] ? allImages[currentIndex].name : null;
    allImages = fresh;
    buildTimeline();
    loadStats().catch(() => {});
    let idx = currentName ? allImages.findIndex(i => i.name === currentName) : -1;
    if (idx < 0 && allImages.length > 0) idx = 0;
    if (idx >= 0) showImage(idx);
    else { currentIndex = -1; updateNav(); }
  } catch (e) { /* nächster Versuch in 60 s */ }
}, 60000);
</script>
</body>
</html>
